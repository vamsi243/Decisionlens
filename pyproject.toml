[project]
name = "decision-lens"
version = "0.1.0"
description = "Live match intelligence on a fully synthetic football match."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=2.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "openai>=1.55",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["contracts", "generator", "engine", "service", "tests"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# Pydantic copies mutable defaults per instance, so class-level [] / {} are safe.
"contracts/*" = ["RUF012"]
